<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks · iOS Automation</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <main class="shell">
        <nav class="breadcrumb"><a href="/">Devices</a><span>/</span><span>Tasks</span>__AUTH_NAV__</nav>
        <header class="page-header">
            <div><span class="eyebrow">Durable scheduler</span><h1>Tasks</h1><p>Upcoming schedules and execution history across every device.</p></div>
            <button id="refresh-tasks" class="button secondary" type="button">Refresh</button>
        </header>
        <section class="panel task-section">
            <div class="section-heading"><div><span class="eyebrow">Queue</span><h2>Schedules</h2></div></div>
            <div id="schedules" class="task-list loading-card"><span class="spinner"></span>Loading schedules…</div>
        </section>
        <section class="panel task-section">
            <div class="section-heading"><div><span class="eyebrow">History</span><h2>Executions</h2></div></div>
            <div id="executions" class="task-list loading-card"><span class="spinner"></span>Loading executions…</div>
        </section>
    </main>
    <script type="module" src="/assets/tasks.js"></script>
</body>
</html>
