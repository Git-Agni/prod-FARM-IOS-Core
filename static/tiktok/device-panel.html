<style>.tiktok-form{display:grid;gap:10px;margin:12px 0 24px}.tiktok-form label{display:grid;gap:4px}.timing{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}</style>
<p>Schedule one-off or recurring private workflows. Device-specific accounts and coordinates belong in <code>pluginData["com.git-agni.tiktok"]</code>.</p>
<form id="tiktok-doomscroll-form" class="tiktok-form">
  <h3>Doomscroll</h3>
  <div class="timing"><label>Duration (minutes)<input name="duration" type="number" min="1" max="180" value="5" required></label><label>Personality<select name="personality"><option>casual</option><option>skimmer</option><option>engaged</option></select></label><label>Account<input name="account" autocomplete="off"></label></div>
  <div><label><input name="like" type="checkbox" checked> Like</label> <label><input name="save" type="checkbox" checked> Save</label></div>
  <div class="timing" data-timing><label>Schedule<select name="timingKind"><option value="now">Run now</option><option value="once">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></label><label>When / local time<input name="time" type="datetime-local"></label><label>Weekdays (0–6)<input name="weekdays" placeholder="1,3,5"></label></div>
  <button type="submit">Schedule doomscroll</button>
</form>
<form id="tiktok-post-form" class="tiktok-form">
  <h3>Post media</h3>
  <label>Media (1–3 files)<input name="media" type="file" accept="image/*,video/*" multiple required></label>
  <div class="timing"><label>Account<input name="account" required autocomplete="off"></label><label>Destination<select name="destination"><option value="draft">Draft</option><option value="publish">Publish</option></select></label><label>Music URL<input name="musicUrl" type="url"></label></div>
  <label>Caption<textarea name="caption" maxlength="2200"></textarea></label>
  <label><input name="recurringPublishConfirmed" type="checkbox"> I explicitly approve recurring public posts</label>
  <div class="timing" data-timing><label>Schedule<select name="timingKind"><option value="now">Run now</option><option value="once">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></label><label>When / local time<input name="time" type="datetime-local"></label><label>Weekdays (0–6)<input name="weekdays" placeholder="1,3,5"></label></div>
  <button type="submit">Upload and schedule</button>
</form>
<p id="tiktok-form-result" class="muted"></p>
<script>
(function () {
  var pluginId = 'com.git-agni.tiktok';
  var deviceUdid = decodeURIComponent(location.pathname.split('/').pop());
  var result = document.getElementById('tiktok-form-result');
  function timing(form) {
    var kind = form.get('timingKind');
    if (kind === 'now') return {kind: 'now'};
    var raw = String(form.get('time') || '');
    if (!raw) throw new Error('Choose a date/time.');
    if (kind === 'once') return {kind: 'once', runAt: new Date(raw).toISOString()};
    var localTime = raw.includes('T') ? raw.split('T')[1].slice(0, 5) : raw.slice(0, 5);
    var base = {kind: kind, localTime: localTime, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone};
    if (kind === 'weekly') base.weekdays = String(form.get('weekdays') || '').split(',').map(Number).filter(Number.isInteger);
    return base;
  }
  async function schedule(taskType, payload, scheduleTiming, assetIds) {
    var response = await fetch('/api/schedules', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({deviceUdid: deviceUdid, task: {pluginId: pluginId, taskType: taskType, taskVersion: 1, payload: payload}, timing: scheduleTiming, assetIds: assetIds || []})});
    if (!response.ok) throw new Error((await response.json()).error || 'Request failed');
    result.textContent = 'Task scheduled.';
    setTimeout(function () { location.reload(); }, 600);
  }
  document.getElementById('tiktok-doomscroll-form').addEventListener('submit', async function (event) {
    event.preventDefault(); result.textContent = 'Scheduling…';
    try { var form = new FormData(event.currentTarget); var payload = {durationMinutes: Number(form.get('duration')), personality: form.get('personality'), likeEnabled: form.has('like'), saveEnabled: form.has('save')}; if (form.get('account')) payload.account = form.get('account'); await schedule('doomscroll', payload, timing(form)); } catch (error) { result.textContent = error.message; }
  });
  document.getElementById('tiktok-post-form').addEventListener('submit', async function (event) {
    event.preventDefault(); result.textContent = 'Uploading…'; var assets = [];
    try {
      var form = new FormData(event.currentTarget); var files = form.getAll('media').filter(function (file) { return file.size; });
      if (files.length < 1 || files.length > 3) throw new Error('Choose one to three files.');
      var upload = new FormData(); files.forEach(function (file) { upload.append('media', file); });
      var uploadResponse = await fetch('/api/assets', {method: 'POST', body: upload});
      if (!uploadResponse.ok) throw new Error((await uploadResponse.json()).error || 'Upload failed');
      assets = await uploadResponse.json();
      var payload = {media: assets.map(function (asset) { return {assetId: asset.id, name: asset.name, mimeType: asset.mimeType}; }), destination: form.get('destination'), account: form.get('account')};
      if (form.get('caption')) payload.caption = form.get('caption'); if (form.get('musicUrl')) payload.musicUrl = form.get('musicUrl'); if (form.has('recurringPublishConfirmed')) payload.recurringPublishConfirmed = true;
      await schedule('post', payload, timing(form), assets.map(function (asset) { return asset.id; }));
    } catch (error) { if (assets.length) await fetch('/api/assets', {method: 'DELETE', headers: {'content-type': 'application/json'}, body: JSON.stringify({assetIds: assets.map(function (asset) { return asset.id; })})}); result.textContent = error.message; }
  });
})();
</script>
